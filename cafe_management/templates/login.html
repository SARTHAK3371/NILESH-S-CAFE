{% extends "base.html" %}
{% block title %}Login - CafeManager{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-cup-hot-fill display-3 text-warning"></i>
            <h2 class="mt-2 fw-bold text-white">CafeManager</h2>
            <p class="text-light">Professional Cafe Management System</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-white">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" required value="admin">
            </div>
            <div class="mb-4">
                <label class="form-label text-white">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" required value="admin123">
            </div>
            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Login</button>
        </form>
        <p class="text-center text-light mt-3 small">Default: admin / admin123</p>
    </div>
</div>
{% endblock %}
